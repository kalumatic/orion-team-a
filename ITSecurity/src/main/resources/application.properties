spring.application.name=sec-track
spring.datasource.url=jdbc:h2:file:./data/securitydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Omogucava H2 konzolu
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update

# Opciono: da se u konzoli vidi sa spring radi s bazom
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Groq AI generation config (hosted Llama)
ai.groq.base-url=${AI_GROQ_BASE_URL:https://api.groq.com/openai/v1}
ai.groq.model=${AI_GROQ_MODEL:llama-3.1-8b-instant}
ai.groq.timeout-seconds=${AI_GROQ_TIMEOUT_SECONDS:30}
ai.groq.api-key=${AI_GROQ_API_KEY:}
ai.model.name=meta-llama/Llama-3.1-8B-Instruct
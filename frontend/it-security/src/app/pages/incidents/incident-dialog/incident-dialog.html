<h2 mat-dialog-title>Create Incident</h2>

<form [formGroup]="form" (ngSubmit)="save()" mat-dialog-content class="dialog-form">

  <mat-form-field appearance="fill">
    <mat-label>Reporter</mat-label>
    <input matInput formControlName="reporter">
    <mat-error *ngIf="form.get('reporter')?.hasError('required')">
      Reporter is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Device</mat-label>
    <input matInput formControlName="device">
    <mat-error *ngIf="form.get('device')?.hasError('required')">
      Device is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Description</mat-label>
    <textarea matInput rows="3" formControlName="description"></textarea>
    <mat-error *ngIf="form.get('description')?.hasError('required')">
      Description is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Date</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="date">
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
    <mat-error *ngIf="form.get('date')?.hasError('required')">
      Date is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Severity</mat-label>
    <mat-select formControlName="severity">
      <mat-option value="Low">Low</mat-option>
      <mat-option value="Medium">Medium</mat-option>
      <mat-option value="High">High</mat-option>
      <mat-option value="Critical">Critical</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Status</mat-label>
    <mat-select formControlName="status">
      <mat-option value="Open">Open</mat-option>
      <mat-option value="In Progress">In Progress</mat-option>
      <mat-option value="Closed">Closed</mat-option>
    </mat-select>
  </mat-form-field>

</form>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="submit" (click)="save()" [disabled]="form.invalid">
    Save
  </button>
</div>

<div class="employee-container">

  <!-- ================= HEADER ================= -->
  <div class="header-row">
    <div class="title-section">
      <h2>Employee Management</h2>
      <div class="subtitle">
        Monitor and manage registered employees
      </div>
    </div>

    <button mat-raised-button class="primary-btn" (click)="openCreateDialog()">
      + New Employee
    </button>
  </div>
  <button 
    mat-raised-button 
    class="primary-btn" 
    (click)="downloadCsv()">
    ⬇ Download CSV
  </button>
  <p> </p>
  <!-- ================= TABLE ================= -->
  <div class="table-wrapper">

    <table mat-table [dataSource]="dataSource" matSort>

      <!-- First Name -->
      <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>First Name</th>
        <td mat-cell *matCellDef="let employee">{{ employee.firstName }}</td>
      </ng-container>

      <!-- Last Name -->
      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Name</th>
        <td mat-cell *matCellDef="let employee">{{ employee.lastName }}</td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let employee">{{ employee.email }}</td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let employee">
          <div class="action-buttons">
            <button mat-button class="update-btn" (click)="openUpdateDialog(employee)">
              Update
            </button>
            <button mat-button class="delete-btn" (click)="deleteEmployee(employee)">
              Delete
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <div class="paginator-wrapper">
      <mat-paginator
        [pageSizeOptions]="[10, 25, 50]"
        [pageSize]="10"
        showFirstLastButtons>
      </mat-paginator>
    </div>

  </div>

</div>

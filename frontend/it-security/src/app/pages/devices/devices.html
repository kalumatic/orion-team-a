<div class="device-container">

  <!-- ================= HEADER ================= -->
  <div class="header-row">
    <div class="title-section">
      <h2>Device Tracking</h2>
      <div class="subtitle">
        Monitor and manage registered devices
      </div>
    </div>

    <button mat-raised-button class="primary-btn" (click)="openCreateDialog()">
      + New Device
    </button>
  </div>

  <!-- ================= TABLE ================= -->
  <div class="table-wrapper">

    <table mat-table [dataSource]="dataSource" matSort>

      <!-- Device Type -->
      <ng-container matColumnDef="deviceType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Device Type</th>
        <td mat-cell *matCellDef="let device">{{ device.deviceType }}</td>
      </ng-container>

      <!-- Model -->
      <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Model</th>
        <td mat-cell *matCellDef="let device">{{ device.model }}</td>
      </ng-container>

      <!-- Serial Number -->
      <ng-container matColumnDef="serialNumber">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Serial Number</th>
        <td mat-cell *matCellDef="let device">{{ device.serialNumber }}</td>
      </ng-container>

      <!-- Assigned Employee -->
      <ng-container matColumnDef="assignedEmployeeName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Assigned Employee</th>
        <td mat-cell *matCellDef="let device">{{ device.assignedEmployeeName }}</td>
      </ng-container>

      <!-- Assignment Date -->
      <ng-container matColumnDef="assignmentDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Assignment Date</th>
        <td mat-cell *matCellDef="let device">{{ device.assignmentDate | date:'mediumDate' }}</td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let device">
          <div class="action-buttons">
            <button mat-button class="reassign-btn" (click)="openReassignDialog(device)">
              Reassign
            </button>
            <button mat-button class="update-btn" (click)="openUpdateDialog(device)">
              Update
            </button>
            <button mat-button class="delete-btn" (click)="deleteDevice(device)">
              Delete
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </div>

</div>

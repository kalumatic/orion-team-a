<h2 mat-dialog-title>{{ isEditMode ? 'Update Device' : 'Create Device' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()" mat-dialog-content class="dialog-form">

  <mat-form-field appearance="fill">
    <mat-label>Device Type</mat-label>
    <input matInput formControlName="deviceType" />
    <mat-error *ngIf="form.get('deviceType')?.hasError('required')">
      Device Type is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Model</mat-label>
    <input matInput formControlName="model" />
    <mat-error *ngIf="form.get('model')?.hasError('required')">
      Model is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Serial Number</mat-label>
    <input matInput formControlName="serialNumber" />
    <mat-error *ngIf="form.get('serialNumber')?.hasError('required')">
      Serial Number is required
    </mat-error>
  </mat-form-field>

</form>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="submit" (click)="save()" [disabled]="form.invalid">
    Save
  </button>
</div>
